name: Security hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "9 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Run repository security and workflow checks
        run: npm run check
